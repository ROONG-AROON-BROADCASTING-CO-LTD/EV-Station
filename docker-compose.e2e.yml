# Isolated dependencies for Playwright. These services never share the normal
# compose project database, Redis data, SMTP server, ports, or credentials.
services:
  db-e2e:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: rbc_ev_station_e2e
      POSTGRES_USER: rbc_e2e
      POSTGRES_PASSWORD: rbc_e2e
    healthcheck:
      # The initialization server accepts Unix-socket connections before the
      # final TCP listener is ready for the migration container.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U rbc_e2e -d rbc_ev_station_e2e"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - e2e_postgres_data:/var/lib/postgresql/data

  migrate-e2e:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./apps/api/migrations:/migrations:ro
    command: ["-path=/migrations", "-database=postgres://rbc_e2e:rbc_e2e@db-e2e:5432/rbc_ev_station_e2e?sslmode=disable", "up"]
    depends_on:
      db-e2e:
        condition: service_healthy

  redis-e2e:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mailhog-e2e:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:18025:8025"

  api-e2e:
    build:
      context: ./apps/api
    environment:
      APP_ENV: test
      API_PORT: 8080
      DATABASE_URL: postgres://rbc_e2e:rbc_e2e@db-e2e:5432/rbc_ev_station_e2e?sslmode=disable
      REDIS_URL: redis://redis-e2e:6379/0
      JWT_SECRET: e2e-isolated-secret-not-for-production
      AUTH_REQUIRED: "true"
      SMTP_HOST: mailhog-e2e
      SMTP_PORT: "1025"
      SMTP_FROM: e2e@rbc.local
      OTP_TTL: 10m
      ANALYSIS_PROVIDER_MODE: unavailable
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:15173
    ports:
      - "127.0.0.1:18080:8080"
    depends_on:
      migrate-e2e:
        condition: service_completed_successfully
      redis-e2e:
        condition: service_healthy
      mailhog-e2e:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  e2e_postgres_data:
