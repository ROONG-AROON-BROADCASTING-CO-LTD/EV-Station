# Public traffic reaches this listener through the existing local Cloudflare
# tunnel. Cloudflare overwrites CF-Connecting-IP; direct localhost is trusted.
map $http_cf_connecting_ip $rbc_client_ip {
  "" $remote_addr;
  default $http_cf_connecting_ip;
}
map $arg_lang $rbc_language {
  default th;
  en en;
}
server {
  listen 80;
  server_name _;
  # The API accepts up to ten site photos or supporting PDF documents.
  client_max_body_size 102m;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    add_header X-Robots-Tag "noindex, nofollow" always;
    # Resolve the container at request time so an API restart cannot crash
    # the entire public frontend during Docker startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-RBC-Client-IP $rbc_client_ip;
    # Analysis creation returns a job ID immediately; longer AI requests still
    # use the general API timeout below.
    proxy_connect_timeout 10s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  # Public HTML is generated from the same React pages for both languages.
  rewrite ^(/investment|/branches|/contact|/guide/customer)/$ $1 permanent;
  location = /welcome { return 301 /$is_args$args; }
  location ~ ^/(investment|branches|contact|guide/customer)$ {
    add_header Cache-Control "no-store, must-revalidate";
    try_files /__pages/$rbc_language$uri.html =404;
  }
  location /__pages/ { internal; }
  location ~ ^/(login|dashboard|documents|sites|analysis|analyses|settings|api-usage|not-investing|data-sources|liff|guide/admin)(/|$) {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, must-revalidate";
    try_files /index.html =404;
  }
  # Unknown URLs must return a real 404 instead of an indexable home page.
  error_page 404 /404.html;
  location = /404.html {
    internal;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location / { try_files $uri $uri/ =404; }

  # Keep the SPA entry document fresh after local deployments. Built assets are
  # content-hashed, but a cached index.html can otherwise keep an older bundle
  # and its print layout open in an existing browser tab.
  location = /index.html {
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  # Browsers normally open the SPA at `/`, not `/index.html`.  Give that
  # entry point the same cache policy so local deployments do not keep an
  # older JavaScript bundle open in an existing tab.
  location = / {
    add_header Cache-Control "no-store, must-revalidate";
    try_files /__pages/$rbc_language/home.html =404;
  }
}
