server {
  listen 80;
  server_name _;
  # The API accepts up to ten site photos or supporting PDF documents.
  client_max_body_size 102m;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # Resolve the container at request time so an API restart cannot crash
    # the entire public frontend during Docker startup.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:8080;
    proxy_pass http://$api_upstream$request_uri;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Analysis creation returns a job ID immediately; longer AI requests still
    # use the general API timeout below.
    proxy_connect_timeout 10s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Keep the SPA entry document fresh after local deployments. Built assets are
  # content-hashed, but a cached index.html can otherwise keep an older bundle
  # and its print layout open in an existing browser tab.
  location = /index.html {
    add_header Cache-Control "no-store, must-revalidate";
    try_files $uri =404;
  }

  # Browsers normally open the SPA at `/`, not `/index.html`.  Give that
  # entry point the same cache policy so local deployments do not keep an
  # older JavaScript bundle open in an existing tab.
  location = / {
    add_header Cache-Control "no-store, must-revalidate";
    try_files /index.html =404;
  }
}
